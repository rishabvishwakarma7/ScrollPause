# Project-wide Gradle settings.

# Enable AndroidX (required — all Jetpack libraries use the androidx namespace)
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Increase build performance
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=false

# Enable Compose metrics (optional — useful for performance analysis)
# android.defaults.buildfeatures.compose=true

# Suppress migration suggestion (we're already using AndroidX)
android.enableJetifier=false
